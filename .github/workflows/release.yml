name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build and publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Write release keystore from secrets (if configured)
        shell: bash
        run: |
          if [[ -n "${{ secrets.NEXASENSE_KEYSTORE_BASE64 }}" ]]; then
            echo "${{ secrets.NEXASENSE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "NEXASENSE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "keystore written (production signing)"
          else
            echo "no keystore secret — release will use the debug fallback key (documented)"
          fi

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Lint
        run: ./gradlew lint

      - name: Assemble release APK
        run: ./gradlew assembleRelease

      - name: Rename APK artifact
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p "$RUNNER_TEMP/dist"
          cp app/build/outputs/apk/release/app-release.apk \
             "$RUNNER_TEMP/dist/NexaSense-v${VERSION}-release.apk"

      - name: Prepare release notes
        shell: bash
        run: |
          sed "s/{{VERSION}}/${GITHUB_REF_NAME#v}/" \
            .github/RELEASE_TEMPLATE.md > "$RUNNER_TEMP/RELEASE_NOTES.md"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NexaSense ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/RELEASE_NOTES.md
          files: |
            ${{ runner.temp }}/dist/NexaSense-*-release.apk
          draft: false
          prerelease: false
